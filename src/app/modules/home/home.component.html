<div class="overlay">
  <div class="wrapper">
    <nav id="sidebar" class="scroll">
      <div id="dismiss">
        <button type="button" class="btn" (click)="toggle()">
          <i class="fas fa-arrow-left"></i>
        </button>
      </div>
      <div class="sidebar-header">
        <!-- <h3>Menú</h3> -->
        <img
          src="../../../../assets/logos/headerLogo2.png"
          class="img-fluid ${3|rounded-top,rounded-right,rounded-bottom,rounded-left,rounded-circle,|}"
          alt=""
        />
      </div>
      <ul class="list-unstyled components">
        <li class="nav-item">
          <a
            (click)="toggle()"
            class="nav-link"
            [routerLink]="['/Inicio']"
            exact
            >Inicio</a
          >
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a
            (click)="toggle()"
            class="nav-link d-flex align-items-center justify-content-between"
            [routerLink]="['archivosMensuales']"
            ><span>Archivos mensuales</span>
            <span
              *ngIf="resumenArchivos.numPendientes > 0"
              class="badge rounded-pill ms-2"
              [ngClass]="resumenArchivos.tieneRechazados ? 'bg-danger text-white' : 'bg-warning text-dark'"
            >
              {{ resumenArchivos.numPendientes }}
            </span>
          </a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a
            (click)="toggle()"
            class="nav-link d-flex align-items-center justify-content-between"
            [routerLink]="['pagosPendientes']"
            ><span>Pagos pendientes</span>
            <span
              *ngIf="resumenPagos.numPendientes > 0"
              class="badge rounded-pill ms-2"
              [ngClass]="resumenPagos.tieneVencidos ? 'bg-danger text-white' : 'bg-warning text-dark'"
            >
              {{ resumenPagos.numPendientes }}
            </span>
          </a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a
            (click)="toggle()"
            class="nav-link"
            [routerLink]="['gastosPorComprobar']"
            >Gastos por comprobar</a
          >
        </li>
      </ul>
    </nav>
  </div>
</div>
<app-header></app-header>
<div style="height: 55px"></div>
<app-breadcrum></app-breadcrum>
<router-outlet></router-outlet>
