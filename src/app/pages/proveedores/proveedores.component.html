<div class="container-fluid">
  <div class="row box">
    <div class="col-12 table-responsive">
      <table class="table table-hover text-center">
        <thead>
          <tr>
            <th>Proveedor</th>
            <th>RFC</th>
          </tr>
        </thead>
        <tbody>
          <tr
            class="pointer"
            *ngFor="let item of arrProviders"
            (click)="goToProvider(item)"
          >
            <td>{{ item.nombreProveedor }}</td>
            <td>{{ item.rfc }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
