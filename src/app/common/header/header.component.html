<header class="py-1">
  <div class="container-fluid">
    <div class="row align-items-center">
      <!-- Logo y botón de menú -->
      <div class="col-auto d-flex align-items-center">
        <a [routerLink]="['./']" class="me-2">
          <img
            src="./assets/logos/headerLogo2.png"
            class="logoHeader"
            alt="logo"
          />
        </a>
        <button
          type="button"
          id="sidebarCollapse"
          class="btn btn-sm p-1"
          title="Menu"
          (click)="toggle()"
        >
          <i class="fas fa-bars bars"></i>
        </button>
      </div>

      <!-- Información central de Empresa y Proyecto en línea -->
      <div class="col text-center d-none d-md-block">
        <div class="d-inline-flex align-items-center gap-2 header-info-badge py-1 px-3" *ngIf="nombreProyecto || dataUser?.name">
          <span class="badge bg-dark border border-secondary text-light" *ngIf="nombreEmpresa">{{ nombreEmpresa }}</span>
          <span class="text-white fw-bold small text-truncate" style="max-width: 250px;">{{ nombreProyecto || dataUser?.name }}</span>
          <span class="text-white-50 small border-start border-secondary ps-2" *ngIf="dataUser?.rfc">RFC: {{ dataUser?.rfc }}</span>
        </div>
      </div>

      <!-- Icono de perfil y menú desplegable -->
      <div class="col-auto ms-auto text-end">
        <a
          class="dropdown-toggle user-btn text-decoration-none"
          role="button"
          id="dropdownMenuLink"
          data-toggle="dropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <span class="user-icon-wrapper">
            <i class="fas fa-user text-white"></i>
          </span>
        </a>

        <div
          class="dropdown-menu dropdown-menu-right text-center"
          aria-labelledby="dropdownMenuLink"
        >
          <!-- <label class="dropdown-header">{{ dataUser.name }}</label> -->
          <label class="dropdown-header">{{ dataUser.email }}</label>
          <label class="dropdown-header">Tipo: {{ dataUser.tipo }}</label>
          <label class="dropdown-item" (click)="onLogout()"
            >Cerrar sesión</label
          >
        </div>
      </div>
    </div>
  </div>
</header>
